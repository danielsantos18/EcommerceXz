<div class="tabla-historial">
  
  <!-- Barra de búsqueda -->
  <mat-form-field appearance="outline" class="custom-form-field">
    <mat-label>Búsqueda por número de pedido</mat-label>
    <input matInput [(ngModel)]="searchText" (input)="filtrarPedidos()" placeholder="Buscar por número de pedido" />
  </mat-form-field>
  
  <!-- Filtro por estado -->
  <mat-form-field appearance="outline" class="custom-form-field">
    <mat-label>Estado del Pedido</mat-label>
    <mat-select [(ngModel)]="estadoFiltro" (selectionChange)="onEstadoChange($event.value)">
      <mat-option value="">Todos</mat-option>
      <mat-option value="Pendiente">Pendiente</mat-option>
      <mat-option value="En Proceso">En Proceso</mat-option>
      <mat-option value="Entregado">Entregado</mat-option>
    </mat-select>
  </mat-form-field>
  
  <!-- Filtro por fecha -->
  <mat-form-field appearance="outline" class="custom-form-field">
    <mat-label>Fecha de inicio</mat-label>
    <input matInput [matDatepicker]="fechaInicioPicker" [(ngModel)]="fechaInicio" (dateChange)="onFechaChange()" placeholder="Desde" />
    <mat-datepicker-toggle matSuffix [for]="fechaInicioPicker"></mat-datepicker-toggle>
    <mat-datepicker #fechaInicioPicker></mat-datepicker>
  </mat-form-field>
  
  <mat-form-field appearance="outline" class="custom-form-field">
    <mat-label>Fecha de fin</mat-label>
    <input matInput [matDatepicker]="fechaFinPicker" [(ngModel)]="fechaFin" (dateChange)="onFechaChange()" placeholder="Hasta" />
    <mat-datepicker-toggle matSuffix [for]="fechaFinPicker"></mat-datepicker-toggle>
    <mat-datepicker #fechaFinPicker></mat-datepicker>
  </mat-form-field>
  
  <!-- Tabla de pedidos -->
  <mat-table [dataSource]="filteredPedidos">
    <!-- Columna para Número de Pedido -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Número de Pedido </th>
      <td mat-cell *matCellDef="let pedido"> {{ pedido.id }} </td>
    </ng-container>
  
    <!-- Columna para Fecha de Pedido -->
    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef> Fecha </th>
      <td mat-cell *matCellDef="let pedido"> {{ pedido.fecha }} </td>
    </ng-container>
  
    <!-- Columna para Estado del Pedido -->
    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let pedido"> {{ pedido.estado }} </td>
    </ng-container>
  
    <!-- Columna para Costo Total -->
    <ng-container matColumnDef="costo">
      <th mat-header-cell *matHeaderCellDef> Costo Total </th>
      <td mat-cell *matCellDef="let pedido"> {{ pedido.costo | currency }} </td>
    </ng-container>
  
    <!-- Columna para Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let pedido">
        <button mat-button (click)="verDetalles(pedido)" class="action-button">Ver Detalles</button>
      </td>
    </ng-container>
  
    <!-- Fila de encabezados -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <!-- Fila de datos -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </mat-table>
</div>
